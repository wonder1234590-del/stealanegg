<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Steal an Egg</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Верхняя панель -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-title">STEAL AN EGG</div>
            <div class="brand-subtitle">Marketplace</div>
        </div>

        <div class="top-actions">

            <button class="balance-button" onclick="openTopUp()">
                ⭐ <span id="balance">0</span>
            </button>

            <button class="support-button" onclick="openSupport()">
                ✓
            </button>

        </div>

    </header>


    <!-- Основное содержимое -->
    <main id="app"></main>


    <!-- Нижняя навигация -->
    <nav class="bottom-nav">

        <button
            class="nav-button active"
            data-page="market"
            onclick="navigate('market')"
        >
            <span class="nav-icon">🏪</span>
            <span>Магазин</span>
        </button>

        <button
            class="nav-button"
            data-page="chat"
            onclick="navigate('chat')"
        >
            <span class="nav-icon">💬</span>
            <span>Чаты</span>
        </button>

        <button
            class="nav-button"
            data-page="sell"
            onclick="navigate('sell')"
        >
            <span class="nav-icon">➕</span>
            <span>Продать</span>
        </button>

        <button
            class="nav-button"
            data-page="profile"
            onclick="navigate('profile')"
        >
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>

    </nav>


    <!-- Уведомления -->
    <div id="toast-container"></div>


    <script src="app.js"></script>

</body>
</html>
